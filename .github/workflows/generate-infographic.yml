name: Generate Infographic

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Announcement / topic text"
        required: true
      title:
        description: "Title (used for filename + notebook)"
        required: false
        default: "Announcement"
      orientation:
        description: "Image orientation"
        required: false
        default: "portrait"
        type: choice
        options: ["portrait", "landscape", "square"]
      detail:
        description: "Detail level"
        required: false
        default: "detailed"
        type: choice
        options: ["concise", "standard", "detailed"]
      style:
        description: "Optional style (blank = auto)"
        required: false
        default: ""
      instructions:
        description: "Optional extra steer for generation"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate-infographic
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore NotebookLM auth
        env:
          # Durable, self-healing (preferred): mint once locally with
          #   notebooklm login --master-token --account you@gmail.com
          # then paste ~/.notebooklm/profiles/default/master_token.json here.
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
          # Fallback: a static cookie snapshot (expires; re-seed when it dies).
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          # Capture secrets, then UNSET the env vars: notebooklm refuses to run
          # `login` while NOTEBOOKLM_AUTH_JSON is set, and that env fast-path
          # would also override the file cookies the master token mints.
          MASTER="$NOTEBOOKLM_MASTER_TOKEN"
          SNAPSHOT="$NOTEBOOKLM_AUTH_JSON"
          unset NOTEBOOKLM_MASTER_TOKEN NOTEBOOKLM_AUTH_JSON
          DIR="$HOME/.notebooklm/profiles/default"
          mkdir -p "$DIR"
          if [ -n "$MASTER" ]; then
            printf '%s' "$MASTER" > "$DIR/master_token.json"
            chmod 600 "$DIR/master_token.json"
            notebooklm login --master-token-refresh
            echo "Master-token auth active (self-healing)."
          elif [ -n "$SNAPSHOT" ]; then
            printf '%s' "$SNAPSHOT" > "$DIR/storage_state.json"
            chmod 600 "$DIR/storage_state.json"
            echo "Cookie-snapshot auth active (may expire)."
          else
            echo "No NotebookLM auth configured (set NOTEBOOKLM_MASTER_TOKEN or NOTEBOOKLM_AUTH_JSON)." >&2
            exit 1
          fi

      - name: Generate infographic
        env:
          # Auth comes from the on-disk profile seeded above — do NOT set
          # NOTEBOOKLM_AUTH_JSON here or it overrides the minted file cookies.
          # Optional: pin a specific notebook to reuse (else a new one is created).
          NOTEBOOKLM_NOTEBOOK: ${{ vars.NOTEBOOKLM_NOTEBOOK }}
          # Inputs travel through the environment, never interpolated into the
          # command line. A steer containing a double quote ended the shell's
          # quoting and argparse received the rest of the sentence as stray
          # arguments: 'unrecognized arguments: Independence Day. No other words'.
          # Newlines in a multi-line steer would break it the same way.
          IN_TEXT: ${{ inputs.text }}
          IN_TITLE: ${{ inputs.title }}
          IN_ORIENTATION: ${{ inputs.orientation }}
          IN_DETAIL: ${{ inputs.detail }}
          IN_STYLE: ${{ inputs.style }}
          IN_INSTRUCTIONS: ${{ inputs.instructions }}
        run: |
          python generate.py \
            --text "$IN_TEXT" \
            --title "$IN_TITLE" \
            --orientation "$IN_ORIENTATION" \
            --detail "$IN_DETAIL" \
            --style "$IN_STYLE" \
            --instructions "$IN_INSTRUCTIONS" \
            --host-dir generated \
            --manifest generated/latest.json \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"

      - name: Upload PNG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: infographic
          path: generated/*.png

      - name: Commit hosted image
        run: |
          git config user.name "infographic-bot"
          git config user.email "infographic-bot@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add infographic ($(date -u +%FT%TZ))"
          # main can advance between checkout and push (our own pushes, or a
          # concurrent run). Rebase and retry; resolve the one file that can
          # conflict (latest.json, rewritten every run) in favour of THIS run.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); syncing with ${GITHUB_REF_NAME}..."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              # Image filenames are unique, so only latest.json can conflict.
              # Keep this run's version (the commit being replayed = "theirs").
              git checkout --theirs -- generated/latest.json 2>/dev/null \
                || git checkout --ours -- generated/latest.json 2>/dev/null || true
              git add generated/
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after retries." >&2
          exit 1

      - name: Publish URL to job summary
        run: |
          URL=$(python -c "import json;print(json.load(open('generated/latest.json'))['url'])")
          echo "### Infographic ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![preview]($URL)" >> "$GITHUB_STEP_SUMMARY"
