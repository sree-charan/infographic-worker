name: Generate Infographic

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Announcement / topic text"
        required: true
      title:
        description: "Title (used for filename + notebook)"
        required: false
        default: "Announcement"
      orientation:
        description: "Image orientation"
        required: false
        default: "portrait"
        type: choice
        options: ["portrait", "landscape", "square"]
      detail:
        description: "Detail level"
        required: false
        default: "detailed"
        type: choice
        options: ["concise", "standard", "detailed"]
      style:
        description: "Optional style (blank = auto)"
        required: false
        default: ""
      instructions:
        description: "Optional extra steer for generation"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate-infographic
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore NotebookLM auth
        env:
          # Durable, self-healing (preferred): mint once locally with
          #   notebooklm login --master-token --account you@gmail.com
          # then paste ~/.notebooklm/profiles/default/master_token.json here.
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
        run: |
          if [ -n "$NOTEBOOKLM_MASTER_TOKEN" ]; then
            mkdir -p "$HOME/.notebooklm/profiles/default"
            printf '%s' "$NOTEBOOKLM_MASTER_TOKEN" > "$HOME/.notebooklm/profiles/default/master_token.json"
            chmod 600 "$HOME/.notebooklm/profiles/default/master_token.json"
            notebooklm login --master-token-refresh || true
            echo "Using master-token auth (self-healing)."
          else
            echo "No master token set; falling back to NOTEBOOKLM_AUTH_JSON cookies."
          fi

      - name: Generate infographic
        env:
          # Fallback / legacy: a static cookie snapshot (expires; re-seed when it dies).
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
          # Optional: pin a specific notebook to reuse (else a new one is created).
          NOTEBOOKLM_NOTEBOOK: ${{ vars.NOTEBOOKLM_NOTEBOOK }}
        run: |
          python generate.py \
            --text "${{ inputs.text }}" \
            --title "${{ inputs.title }}" \
            --orientation "${{ inputs.orientation }}" \
            --detail "${{ inputs.detail }}" \
            --style "${{ inputs.style }}" \
            --instructions "${{ inputs.instructions }}" \
            --host-dir generated \
            --manifest generated/latest.json \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"

      - name: Upload PNG as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: infographic
          path: generated/*.png

      - name: Commit hosted image
        run: |
          git config user.name "infographic-bot"
          git config user.email "infographic-bot@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add infographic ($(date -u +%FT%TZ))"
          # main can advance between checkout and push (our own pushes, or a
          # concurrent run). Rebase and retry; resolve the one file that can
          # conflict (latest.json, rewritten every run) in favour of THIS run.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); syncing with ${GITHUB_REF_NAME}..."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              # Image filenames are unique, so only latest.json can conflict.
              # Keep this run's version (the commit being replayed = "theirs").
              git checkout --theirs -- generated/latest.json 2>/dev/null \
                || git checkout --ours -- generated/latest.json 2>/dev/null || true
              git add generated/
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push after retries." >&2
          exit 1

      - name: Publish URL to job summary
        run: |
          URL=$(python -c "import json;print(json.load(open('generated/latest.json'))['url'])")
          echo "### Infographic ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![preview]($URL)" >> "$GITHUB_STEP_SUMMARY"
